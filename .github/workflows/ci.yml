name: CI

# Triggers: every pull request (any base branch) and every push to the default
# branch. Nothing else - no schedule, no workflow_dispatch.
on:
  pull_request:
  push:
    branches: [main]

# Least privilege. Nothing here writes to the repo, publishes packages, or
# comments on PRs, so read access to contents is all that is needed.
permissions:
  contents: read

# Supersede in-flight runs for the same ref instead of queueing them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The project targets Python 3.11. Source: the checked-in-adjacent PyCharm
  # config `.idea/misc.xml`, which sets project-jdk-name "Python 3.11
  # (repcheck)" (also `.idea/repcheck.iml`). That is the only version marker in
  # the repo - there is no setup.py, pyproject.toml, tox.ini, Dockerfile or
  # runtime.txt, and `.idea/` is gitignored, so this is a weak signal. Pinned
  # explicitly rather than floating on `latest` so an upstream Python release
  # cannot turn into a surprise red build. See the report for the caveat.
  PYTHON_VERSION: '3.11'

jobs:
  # ---------------------------------------------------------------------------
  # GATING. A failure here should block the merge.
  # ---------------------------------------------------------------------------
  test:
    name: Tests and compile check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          # Glob rather than an explicit list: requirements-dev.txt does not
          # exist on main yet (it arrives with PR #1), and naming a file that
          # does not exist makes setup-python fail. `requirements*.txt` always
          # matches at least requirements.txt, and picks up the dev file
          # automatically once it lands.
          cache-dependency-path: requirements*.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install dev dependencies
        # requirements-dev.txt (pytest, httpx) is added by PR #1 on branch
        # security/patch-critical and is not on main yet. Installed
        # conditionally so this job does not fail on a missing file. Note the
        # dev file itself starts with `-r requirements.txt`, so the two installs
        # are consistent by construction.
        # TODO: once PR #1 has merged, this can become an unconditional
        # `pip install -r requirements-dev.txt`.
        run: |
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            echo "requirements-dev.txt is not present on this ref - skipping."
          fi

      - name: Compile check
        # GATING: byte-compiles every module under app/ and fails on a syntax
        # error. This is the only static signal the repo has - there is no
        # linter, formatter or type checker configured, and adding one is
        # explicitly out of scope for this change.
        #
        # Deliberately placed BEFORE the test step: a failing test would
        # otherwise abort the job and suppress the repo's only static signal in
        # that run. Compiling first means both signals are reported whenever
        # the static one is the thing that broke.
        #
        # `-q` suppresses the per-file listing but still prints errors. Note
        # this is a syntax check, not an import check: it will not catch a bad
        # import or a missing dependency.
        run: python -m compileall -q app

      - name: Run tests
        # GATING: a real test failure fails this job and blocks the merge.
        #
        # Two escape hatches exist because tests/ is not on main yet (it
        # arrives with PR #1). Both are SELF-RETIRING: each is conditioned on
        # the pre-PR#1 state of the checkout, so neither survives the merge of
        # PR #1 and neither has to be remembered and deleted by hand.
        #
        #   1. pytest is not installed. It ships in requirements-dev.txt, which
        #      is absent on main, so the install step above installs nothing.
        #      Guarded on `[ ! -f requirements-dev.txt ]`, i.e. only tolerated
        #      on a ref that has no dev-dependency file at all. Once PR #1 adds
        #      requirements-dev.txt, dropping the pytest pin from it makes this
        #      step red (`python -m pytest` exits 1, "No module named pytest")
        #      instead of silently skipping 41 tests.
        #
        #   2. pytest is installed but collects zero tests. pytest uses exit
        #      code 5 for "no tests collected" - a NON-ZERO exit that would
        #      fail this job even though nothing is wrong on main. Guarded on
        #      `[ ! -f requirements-dev.txt ] && [ ! -d tests ]`, i.e. only
        #      tolerated on a ref that predates PR #1 entirely. Deleting
        #      tests/, or emptying it, on any ref that has requirements-dev.txt
        #      leaves exit 5 unhandled and the job goes red.
        #
        # Without the guards this job is red on main today, which the CI
        # conventions forbid: a check that is red on day one trains people to
        # merge past red. Neither hatch can mask a real failure - pytest exit
        # codes 1 (tests failed), 2 (interrupted), 3 (internal error) and
        # 4 (usage error) all still fail the job on every ref.
        run: |
          if [ ! -f requirements-dev.txt ] && ! python -m pytest --version >/dev/null 2>&1; then
            echo "::warning title=Tests skipped::pytest is not installed and requirements-dev.txt is not on this ref, so there are no tests to run. Expected until PR #1 merges; once that file exists this guard no longer applies and a missing pytest fails the job."
            exit 0
          fi

          set +e
          python -m pytest
          status=$?
          set -e

          if [ "$status" -eq 5 ] && [ ! -f requirements-dev.txt ] && [ ! -d tests ]; then
            echo "::warning title=No tests collected::pytest exited 5 (zero tests collected) on a ref with no tests/ directory and no requirements-dev.txt. Expected until PR #1 adds tests/; once either exists this guard no longer applies and exit 5 fails the job."
            exit 0
          fi

          exit "$status"

  # ---------------------------------------------------------------------------
  # ADVISORY. This job reports and never blocks. See the comment below.
  # ---------------------------------------------------------------------------
  audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # No pip cache here on purpose: this job installs only pip-audit, not
          # requirements.txt, so there is nothing worth caching.

      - name: Install pip-audit
        # Pinned so the tool version cannot shift under the build. Note this
        # does NOT freeze the results: pip-audit queries the PyPI/OSV advisory
        # feeds at run time, so new advisories will show up on their own.
        run: python -m pip install pip-audit==2.10.1

      - name: Audit pinned dependencies (ADVISORY - does not gate)
        # ADVISORY BY DESIGN, via `continue-on-error: true` below: the step
        # keeps pip-audit's real exit code (so a crash is visible as a red
        # step) while the job's conclusion stays success and the merge is not
        # blocked. That is a deliberate stage, not an oversight.
        #
        # The earlier `| tee ... || true` plus trailing `exit 0` form was
        # replaced because it flattened every outcome to 0: a pip-audit crash
        # (registry unreachable, bad flag, unreadable requirements file) looked
        # exactly like a clean audit - green step, empty report block. Now only
        # a genuinely clean audit exits 0; anything else surfaces as a red step
        # inside a green job. Note pip-audit reuses exit 1 both for "advisories
        # found" and for some usage errors, so read the captured output (echoed
        # into the run summary along with the exit code) to tell them apart.
        #
        # requirements.txt has known advisories that are deliberately out of
        # scope for this change. Verified locally with pip-audit 2.10.1:
        #
        #   on main today          15 advisories across 6 packages
        #                          (starlette 9, idna 2, click 1, h11 1,
        #                           mako 1, python-dotenv 1)
        #   after PR #1 merges     10 advisories across 2 packages
        #                          (starlette 9, mako 1) - PR #1 bumps
        #                           click, h11, idna and python-dotenv
        #
        # Either way a gating audit is red on day one, which the CI conventions
        # forbid. So this reports loudly - full output in the log and in the run
        # summary - and lets the merge through.
        #
        # TO MAKE THIS GATE, in this order:
        #   1. Upgrade starlette. The fix versions run 0.40.0 through 1.3.1;
        #      anything at or past 1.x is a FastAPI compatibility question, not
        #      a one-line pin bump, and needs its own change.
        #   2. Upgrade mako to >= 1.3.12.
        #   3. Delete the `continue-on-error: true` line below, so a newly
        #      published advisory fails the build.
        # Until then, do NOT add this job to the required status checks - it is
        # non-gating by design and will report findings on every run.
        continue-on-error: true
        run: |
          set -o pipefail
          echo "Advisory only: findings below do NOT fail this build."

          status=0
          python -m pip_audit -r requirements.txt 2>&1 | tee audit-output.txt || status=$?

          {
            echo "### Dependency audit (advisory)"
            echo
            echo "\`pip-audit -r requirements.txt\` - **reported only, does not gate.**"
            echo
            echo "pip-audit exit code: \`${status}\` (0 = no advisories; non-zero = advisories found, or pip-audit failed to run - read the output below to tell which)."
            echo
            echo '```'
            cat audit-output.txt
            echo '```'
            echo
            echo "See the comment in \`.github/workflows/ci.yml\` for what has to change before this can gate."
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"
